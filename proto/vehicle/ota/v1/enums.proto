syntax = "proto3";

package vehicle.ota.v1;

option cc_enable_arenas = true;

// =============================================================================
// vehicle.ota.v1 enums - OTA 业务共享枚举 (CGW-FOTA-DSN-CR-009)
// =============================================================================
// proto3 枚举值在 package 内为兄弟作用域（C++ scoping），故所有值以枚举前缀命名
// 以保证全局唯一。保留 *_UNSPECIFIED = 0；已发布字段号不复用，删除字段 reserved。
// =============================================================================

// ECU 清单上报模式。
enum InventoryMode {
  INVENTORY_MODE_UNSPECIFIED = 0;
  INVENTORY_MODE_FULL = 1;     // 完整清单
  INVENTORY_MODE_DIGEST = 2;   // 摘要清单
}

// 清单处置结果（云端对车端清单的判定）。
enum InventoryDisposition {
  INVENTORY_DISPOSITION_UNSPECIFIED = 0;
  INVENTORY_DISPOSITION_ACCEPTED = 1;             // 接受，可解析任务
  INVENTORY_DISPOSITION_FULL_REQUIRED = 2;        // 要求下次发送 FULL
  INVENTORY_DISPOSITION_REVISION_CONFLICT = 3;    // inventoryRevision 冲突
  INVENTORY_DISPOSITION_DIGEST_MISMATCH = 4;      // 摘要不匹配
  INVENTORY_DISPOSITION_ALGORITHM_UNSUPPORTED = 5;// 算法不支持
}

// 任务可用性状态。
enum AvailabilityStatus {
  AVAILABILITY_UNSPECIFIED = 0;
  AVAILABILITY_NOT_RELEASED = 1;   // 未到 releaseAt
  AVAILABILITY_RELEASED = 2;       // 已发布，可预下载
  AVAILABILITY_EXPIRED = 3;        // 超过 endTime
  AVAILABILITY_SUPERSEDED = 4;     // 被取代
}

// 本地任务处置（云端对车端本地任务状态的判定）。
enum LocalTaskDisposition {
  LOCAL_TASK_DISPOSITION_UNSPECIFIED = 0;
  LOCAL_TASK_DISPOSITION_NONE = 1;       // 无本地任务
  LOCAL_TASK_DISPOSITION_ACTIVE = 2;     // 本地任务仍有效，继续
  LOCAL_TASK_DISPOSITION_COMPLETED = 3;  // 本地任务已完成
  LOCAL_TASK_DISPOSITION_DEFERRED = 4;   // 暂缓（存在活动 Execution/回滚/证据依赖）
  LOCAL_TASK_DISPOSITION_REJECTED = 5;   // 拒绝清理
}

// 包缓存动作。
enum PackageCacheAction {
  PACKAGE_CACHE_ACTION_UNSPECIFIED = 0;
  PACKAGE_CACHE_ACTION_NONE = 1;
  PACKAGE_CACHE_ACTION_PURGE = 2;
  PACKAGE_CACHE_ACTION_KEEP = 3;
}

// 用户授权状态。
enum ConsentStatus {
  CONSENT_STATUS_UNSPECIFIED = 0;
  CONSENT_STATUS_PENDING = 1;
  CONSENT_STATUS_ACCEPTED = 2;
  CONSENT_STATUS_REJECTED = 3;
  CONSENT_STATUS_REVOKED = 4;
  CONSENT_STATUS_EXPIRED = 5;
}

// 下载/校验阶段类型。
enum StageResultType {
  STAGE_RESULT_TYPE_UNSPECIFIED = 0;
  STAGE_RESULT_TYPE_DOWNLOAD = 1;
  STAGE_RESULT_TYPE_VERIFY_HASH = 2;
  STAGE_RESULT_TYPE_VERIFY_SIGNATURE = 3;
  STAGE_RESULT_TYPE_VERIFY_CERT = 4;
  STAGE_RESULT_TYPE_DECRYPT = 5;
}

// 下载/校验阶段结果。
enum StageResultStatus {
  STAGE_RESULT_STATUS_UNSPECIFIED = 0;
  STAGE_RESULT_STATUS_SUCCEEDED = 1;
  STAGE_RESULT_STATUS_FAILED = 2;
}

// Execution 状态（单次安装尝试）。
enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_PERMIT_PERSISTED = 1;
  EXECUTION_STATUS_READY = 2;
  EXECUTION_STATUS_INSTALL_STARTED = 3;
  EXECUTION_STATUS_INSTALL = 4;
  EXECUTION_STATUS_REBOOT = 5;
  EXECUTION_STATUS_POST_CHECK = 6;
  EXECUTION_STATUS_ROLLBACK = 7;
  EXECUTION_STATUS_RESULT_PENDING = 8;
  EXECUTION_STATUS_SUCCEEDED = 9;
  EXECUTION_STATUS_FAILED = 10;
  EXECUTION_STATUS_ROLLED_BACK = 11;
  EXECUTION_STATUS_CANCELED = 12;
}

// 执行阶段。
enum ExecutionStage {
  EXECUTION_STAGE_UNSPECIFIED = 0;
  EXECUTION_STAGE_INSTALL = 1;
  EXECUTION_STAGE_REBOOT = 2;
  EXECUTION_STAGE_POST_CHECK = 3;
  EXECUTION_STAGE_ROLLBACK = 4;
}

// 事件响应状态。
enum EventResponseStatus {
  EVENT_RESPONSE_STATUS_UNSPECIFIED = 0;
  EVENT_RESPONSE_STATUS_ACCEPTED = 1;     // 已接受，水位推进
  EVENT_RESPONSE_STATUS_BUFFERED = 2;     // 暂存，等待后续
  EVENT_RESPONSE_STATUS_RESYNC = 3;       // 需要重同步，按缺失范围补发
}

// 控制指令类型。
enum ControlCommandType {
  CONTROL_COMMAND_TYPE_UNSPECIFIED = 0;
  CONTROL_COMMAND_TYPE_PAUSE = 1;
  CONTROL_COMMAND_TYPE_ABORT = 2;
  CONTROL_COMMAND_TYPE_ROLLBACK = 3;
  CONTROL_COMMAND_TYPE_RESYNC = 4;
  CONTROL_COMMAND_TYPE_RESUME = 5;
}

// 控制应用模式。
enum ControlApplyMode {
  CONTROL_APPLY_MODE_UNSPECIFIED = 0;
  CONTROL_APPLY_MODE_IMMEDIATE = 1;        // 立即应用
  CONTROL_APPLY_MODE_AT_SAFE_POINT = 2;    // 在安全点应用
}

// 控制回执状态。
enum ControlAckStatus {
  CONTROL_ACK_STATUS_UNSPECIFIED = 0;
  CONTROL_ACK_STATUS_APPLIED = 1;
  CONTROL_ACK_STATUS_DEFERRED = 2;
  CONTROL_ACK_STATUS_REJECTED = 3;
  CONTROL_ACK_STATUS_SUPERSEDED = 4;
}

// 日志上传结果状态。
enum LogUploadStatus {
  LOG_UPLOAD_STATUS_UNSPECIFIED = 0;
  LOG_UPLOAD_STATUS_UPLOADED = 1;
  LOG_UPLOAD_STATUS_FAILED = 2;
}

// VehicleTask 生命周期状态。
enum VehicleTaskStatus {
  VEHICLE_TASK_STATUS_UNSPECIFIED = 0;
  VEHICLE_TASK_STATUS_NONE = 1;
  VEHICLE_TASK_STATUS_DISCOVERED = 2;
  VEHICLE_TASK_STATUS_CONSENT_PENDING = 3;
  VEHICLE_TASK_STATUS_DOWNLOAD_PENDING = 4;
  VEHICLE_TASK_STATUS_DOWNLOADING = 5;
  VEHICLE_TASK_STATUS_READY = 6;
  VEHICLE_TASK_STATUS_WAITING_WINDOW = 7;
  VEHICLE_TASK_STATUS_PERMIT_PENDING = 8;
  VEHICLE_TASK_STATUS_EXECUTING = 9;
  VEHICLE_TASK_STATUS_RETRY_PENDING = 10;
  VEHICLE_TASK_STATUS_ROLLBACK_PENDING = 11;
  VEHICLE_TASK_STATUS_PAUSED = 12;
  VEHICLE_TASK_STATUS_COMPLETED = 13;
  VEHICLE_TASK_STATUS_ENDED = 14;
}

// 对账恢复动作。
enum ReconcileAction {
  RECONCILE_ACTION_UNSPECIFIED = 0;
  RECONCILE_ACTION_RESUME = 1;
  RECONCILE_ACTION_RESEND_EVENTS = 2;
  RECONCILE_ACTION_RESTART_RETRYABLE_STAGE = 3;
  RECONCILE_ACTION_PAUSE = 4;
  RECONCILE_ACTION_ABORT = 5;
  RECONCILE_ACTION_NONE = 6;
}

// 下一步动作建议。
enum NextAction {
  NEXT_ACTION_UNSPECIFIED = 0;
  NEXT_ACTION_PROCEED = 1;
  NEXT_ACTION_WAIT = 2;
  NEXT_ACTION_RETRY = 3;
  NEXT_ACTION_ROLLBACK = 4;
  NEXT_ACTION_STOP = 5;
  NEXT_ACTION_RESYNC = 6;
}
