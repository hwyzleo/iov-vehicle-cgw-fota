syntax = "proto3";

package vehicle.ota.v1;

import "vehicle/common/v1/envelope.proto";
import "vehicle/ota/v1/enums.proto";
import "vehicle/ota/v1/inventory.proto";
import "vehicle/ota/v1/task.proto";

option cc_enable_arenas = true;

// =============================================================================
// vehicle.ota.v1 execution - 安装许可、事件与最终结果
// (CGW-FOTA-DSN-CR-009 §安装许可/事件/结果, US-014, US-015)
// =============================================================================
// 仅在 startTime <= now < endTime、任务允许且全部本地门禁通过时申请安装。
// 云端允许后 durable 保存 executionId/attemptNo/permitId/token/controlRevision/
// validUntil/离线/超时策略后再调用执行器。validUntil 只约束进入 INSTALL_STARTED。
// 事件先持久化再分配/发送严格递增 sequenceNo；维护连续 acceptedSequenceNo；
// 只有事件连续且 resultAccepted=true 时收口 Execution。
// =============================================================================

// 本地就绪摘要 + 条件集合。
message VehicleConditionSnapshot {
  string condition_set_version = 1;
  string condition_snapshot = 2;       // 条件快照（序列化）
  string local_readiness_digest = 3;   // 本地就绪摘要
  repeated string passed_guards = 4;
  repeated string failed_guards = 5;
}

// 安装许可请求。
message InstallPermitRequest {
  vehicle.common.v1.RequestEnvelope envelope = 1;
  string vehicle_task_id = 2;
  string task_revision = 3;
  string plan_version = 4;
  string package_manifest_digest_hex = 5;
  string consent_receipt_id = 6;
  VehicleConditionSnapshot condition = 7;
}

// 安装许可响应。
message InstallPermitResponse {
  vehicle.common.v1.RequestEnvelope envelope = 1;
  bool permitted = 2;
  string execution_id = 3;
  uint32 attempt_no = 4;
  string permit_id = 5;
  string permit_token = 6;
  string control_revision = 7;
  int64  valid_until_ms = 8;           // 仅约束进入 INSTALL_STARTED
  TaskPolicy offline_policy = 9;       // 引用 task.proto 的 TaskPolicy
  TaskPolicy timeout_policy = 10;
  string deny_reason = 11;
  int64  next_retry_at_ms = 12;
}

// 执行事件。先 durable 写入 payload，再分配/提交 sequenceNo。
message ExecutionEvent {
  vehicle.common.v1.RequestEnvelope envelope = 1;
  string execution_id = 2;
  uint64 sequence_no = 3;              // 严格递增
  string event_id = 4;                 // 幂等标识
  string event_digest = 5;             // 事件摘要，幂等重传校验
  ExecutionStage stage = 6;
  uint32 progress_percent = 7;
  StageResultStatus result = 8;
  int64  timestamp_ms = 9;
  string payload_summary = 10;         // 不含完整 payload
}

// 缺失事件范围（RESYNC/BUFFERED 补发）。
message EventRange {
  uint64 from_sequence_no = 1;
  uint64 to_sequence_no = 2;
}

// 事件响应。
message EventResponse {
  vehicle.common.v1.RequestEnvelope envelope = 1;
  EventResponseStatus status = 2;
  uint64 accepted_sequence_no = 3;     // 连续水位
  repeated EventRange missing_ranges = 4;
  string error_code = 5;
  string error_detail = 6;
}

// 安装检查点（不含下载偏移；下载偏移由 packageId + ETag + offset 恢复）。
message InstallCheckpoint {
  string execution_id = 1;
  ExecutionStage stage = 2;
  uint32 progress_percent = 3;
  int64  checkpoint_at_ms = 4;
  bytes  opaque_state = 5;             // 执行器私有状态（不进车云 Proto 业务字段）
}

// 最终版本清单（安装后）。
message FinalInventory {
  InventoryInfo inventory = 1;
}

// 最终结果上报。
message FinalResult {
  vehicle.common.v1.RequestEnvelope envelope = 1;
  string execution_id = 2;
  FinalInventory final_inventory = 3;
  ExecutionStatus result_status = 4;
  string control_revision = 5;
  uint64 final_sequence_no = 6;
  int64  completed_at_ms = 7;
}

// 最终结果响应。
message FinalResultResponse {
  vehicle.common.v1.RequestEnvelope envelope = 1;
  bool result_accepted = 2;
  VehicleTaskStatus vehicle_task_status = 3;
  NextAction next_action = 4;
  string error_code = 5;
  string error_detail = 6;
}
