syntax = "proto3";

package vehicle.ota.v1;

import "vehicle/common/v1/envelope.proto";
import "vehicle/ota/v1/enums.proto";

option cc_enable_arenas = true;

// =============================================================================
// vehicle.ota.v1 package - 下载授权与校验结果 (CGW-FOTA-DSN-CR-009 §下载, US-013)
// =============================================================================
// 按 taskRevision + packageRevision 申请下载凭证；以 STORED_OBJECT 字节偏移处理
// Range 续传。ETag/packageRevision 变化时执行 RESET_OFFSET，不得沿用旧偏移。
// 下载与校验终态通过独立结果接口以 stageResultId + stageResultDigest 上报。
// =============================================================================

// 下载授权请求。
message DownloadGrantRequest {
  vehicle.common.v1.RequestEnvelope envelope = 1;
  string vehicle_task_id = 2;
  string task_revision = 3;
  string package_id = 4;
  string package_revision = 5;
  int64  current_offset = 6;          // STORED_OBJECT 字节偏移
}

// 下载授权响应。
message DownloadGrantResponse {
  vehicle.common.v1.RequestEnvelope envelope = 1;
  bool granted = 2;
  string url = 3;
  string object_key = 4;
  string etag = 5;
  string package_revision = 6;        // 云端当前版本；变化则需 RESET_OFFSET
  string credential_token = 7;
  int64  credential_expires_at_ms = 8;
  vehicle.common.v1.DigestInfo digest = 9;
  vehicle.common.v1.SignatureInfo signature = 10;
  bool reset_offset = 11;             // 要求清零偏移并替换 ETag/packageRevision
  string error_code = 12;
  string error_detail = 13;
}

// 下载/校验阶段结果上报。
message StageResultReport {
  vehicle.common.v1.RequestEnvelope envelope = 1;
  string vehicle_task_id = 2;
  string task_revision = 3;
  string package_id = 4;
  string package_revision = 5;
  string stage_result_id = 6;         // 稳定 ID，幂等
  StageResultType stage_result_type = 7;
  StageResultStatus stage_result_status = 8;
  string stage_result_digest = 9;     // 内容摘要
  string error_code = 10;
  string error_detail = 11;
  int64  completed_at_ms = 12;
  int64  bytes_downloaded = 13;
}

// 阶段结果响应。
message StageResultResponse {
  vehicle.common.v1.RequestEnvelope envelope = 1;
  bool accepted = 2;
  bool conflict = 3;                  // stageResultId 相同但摘要不同
  StageResultType expected_stage = 4; // 期望的下一阶段
  string error_code = 5;
  string error_detail = 6;
}

// 全部包 ready 后的清单摘要。
message PackageManifestDigest {
  string algorithm = 1;
  string manifest_digest_hex = 2;     // 所有 package digest 的再摘要
  repeated string package_ids = 3;
  repeated string package_digest_hex = 4;
}
