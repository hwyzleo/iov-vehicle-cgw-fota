syntax = "proto3";

package vehicle.ota.v1;

import "vehicle/common/v1/envelope.proto";
import "vehicle/ota/v1/enums.proto";
import "vehicle/ota/v1/inventory.proto";

option cc_enable_arenas = true;

// =============================================================================
// vehicle.ota.v1 task - 升级任务检测 (CGW-FOTA-DSN-CR-009 §任务检测, US-011)
// =============================================================================

// 本地任务状态摘要（随检测请求上报）。
message LocalTaskStatus {
  string vehicle_task_id = 1;
  VehicleTaskStatus status = 2;
  string task_revision = 3;
  string execution_id = 4;            // 当前活动 Execution（若有）
  ExecutionStatus execution_status = 5;
  uint32 attempt_no = 6;
  int64  accepted_sequence_no = 7;    // 事件水位
  string control_revision = 8;
}

// 升级包清单条目。
message PackageInfo {
  string package_id = 1;
  string package_revision = 2;
  int64  size_bytes = 3;
  string etag = 4;
  string url = 5;                     // 对象存储 URL（数据面）
  string object_key = 6;
  vehicle.common.v1.DigestInfo digest = 7;
  vehicle.common.v1.SignatureInfo signature = 8;
  repeated string target_ecu_ids = 9; // 目标 ECU
}

// 任务策略（离线/超时等，冻结后随 Execution 保存）。
message TaskPolicy {
  int64  offline_grace_ms = 1;        // 离线宽限
  int64  timeout_ms = 2;              // 执行超时
  bool   allow_retry = 3;
  uint32 max_attempts = 4;
  int64  retry_backoff_ms = 5;
}

// 任务检测请求。
message TaskCheckRequest {
  vehicle.common.v1.RequestEnvelope envelope = 1;
  InventoryInfo inventory = 2;
  LocalTaskStatus local_task = 3;
}

// 任务检测响应。
message TaskCheckResponse {
  vehicle.common.v1.RequestEnvelope envelope = 1;
  InventoryDisposition inventory_disposition = 2;
  AvailabilityStatus availability_status = 3;
  LocalTaskDisposition local_task_disposition = 4;
  PackageCacheAction package_cache_action = 5;
  bool download_allowed = 6;
  bool install_request_allowed = 7;
  string vehicle_task_id = 8;
  string task_revision = 9;
  string target_baseline_id = 10;
  vehicle.common.v1.TimeWindow time_window = 11;
  TaskPolicy policy = 12;
  repeated PackageInfo packages = 13;
  string plan_version = 14;           // 安装计划版本
  string error_code = 15;
  string error_detail = 16;
}

// 冻结任务快照（durable 保存，按 taskRevision 管理）。
message FrozenTaskSnapshot {
  string vehicle_task_id = 1;
  string task_revision = 2;
  string target_baseline_id = 3;
  vehicle.common.v1.TimeWindow time_window = 4;
  TaskPolicy policy = 5;
  repeated PackageInfo packages = 6;
  string plan_version = 7;
  int64  frozen_at_ms = 8;
}
