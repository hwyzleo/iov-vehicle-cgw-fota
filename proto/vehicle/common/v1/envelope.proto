syntax = "proto3";

package vehicle.common.v1;

option cc_enable_arenas = true;

// =============================================================================
// vehicle.common.v1 - 公共报文头 (CGW-FOTA-DSN-CR-009 §Protobuf SSOT 与传输映射)
// =============================================================================
// 公共 Envelope 统一承载/映射 requestId、timestamp、protocolVersion、deviceId、
// VIN、vehicleTaskId、executionId、idempotencyKey 和 payload type。
// SOME/IP Header 已有字段建立显式映射；TBOX 负责将该 Envelope 在 SOME/IP 与 MQTT
// 之间做传输映射，但不得重新定义 OTA 业务字段。
//
// 升级包和日志文件不进入 Protobuf；Proto 仅传 URL、objectKey、ETag、摘要、大小和
// 安全元数据，数据面走对象存储/CDN。
//
// 本 .proto 为 CGW-FOTA 仓库内冻结的统一协议契约（CGW-FOTA-DSN-CR-009 迁移步骤1），
// 字段结构遵循整车级文档规范；待外部统一协议仓库建立后整体迁移并由 release-set
// 锁定版本。
// =============================================================================

// 公共报文头。所有 OTA 业务请求/响应消息内嵌或携带本 Envelope。
message RequestEnvelope {
  string request_id = 1;          // 请求标识，跨段传播
  int64  timestamp_ms = 2;        // 毫秒级 Unix epoch
  string protocol_version = 3;    // 协议版本，如 "ota-v1"
  string device_id = 4;           // 设备标识
  string vin = 5;                 // VIN（敏感标识，仅协议承载，不进日志原文）
  string vehicle_task_id = 6;     // 关联 VehicleTask
  string execution_id = 7;        // 关联 Execution（安装阶段）
  string idempotency_key = 8;     // 写操作幂等键
  string nonce = 9;               // 防重放随机数
  string trace_id = 10;           // 分布式追踪标识
  string payload_type = 11;       // 消息类型标识
}

// 时间窗口。
message TimeWindow {
  int64 release_at_ms = 1;        // 任务发布时间；未到则未发布
  int64 start_time_ms = 2;        // 安装窗口开始
  int64 end_time_ms = 3;          // 安装窗口结束；超过不创建新 Execution
}

// 摘要元数据（升级包/日志/清单等对象的摘要描述，不含数据面内容）。
message DigestInfo {
  string algorithm = 1;           // 如 "sha-256"
  string digest_hex = 2;          // 小写 hex
}

// 签名信息（用途/信任链/有效期由校验方判断；MVP 可由 Mock 返回确定结果）。
message SignatureInfo {
  string algorithm = 1;           // 签名算法
  string signature_hex = 2;       // 签名值（协议承载；真实凭据不下发到车端业务日志）
  string cert_ref = 3;            // 证书引用/指纹
  int64  cert_not_before_ms = 4;
  int64  cert_not_after_ms = 5;
}

// =============================================================================
// vehicle.common.v1 - 传输层公共 Envelope (CGW-FOTA-DSN-CR-010)
// =============================================================================
// 通用车云消息传输端口的公共 Envelope：稳定承载 message_id / correlation_id /
// message_kind / service / payload_type / protocol_version / timestamp /
// expire_at / idempotency_key / vehicle_task_id / execution_id / trace 与不透明
// 业务 payload。
//
// 业务 payload 使用 vehicle.ota.v1 的 Protobuf 消息（内嵌 RequestEnvelope），作为
// 不透明 bytes 交给中间链路；中间链路（TBOX）只理解本 Envelope 与路由，不得解析
// payload 字段。字段号/名称按 CGW-FOTA-DSN-CR-010 设计冻结，作为本项目传输契约
// SSOT（车端各项目维护各自 proto，无统一 proto 仓库，仅有统一文档 SSOT）。
// =============================================================================

// 消息方向/形态。
enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_REQUEST = 1;    // 请求
  MESSAGE_KIND_RESPONSE = 2;   // 响应
  MESSAGE_KIND_EVENT = 3;      // 下行事件/单向事件
}

// 传输层公共 Envelope。
message VehicleMessageEnvelope {
  string message_id = 1;                // 请求全局唯一；响应 correlation_id = 请求 message_id
  optional string correlation_id = 2;   // 响应关联 ID
  MessageKind message_kind = 3;
  string service = 4;                   // 稳定业务域标识，如 "vehicle.ota"
  string payload_type = 5;              // 稳定版本化业务消息类型，如 "ota.task-check.request.v1"
  string protocol_version = 6;          // 如 "ota-v1"
  int64 timestamp_ms = 7;
  optional int64 expire_at_ms = 8;      // TTL 截止（ms since epoch）；到期后进入业务层前拒绝
  optional string idempotency_key = 9;  // 写操作幂等键
  optional string vehicle_task_id = 10;
  optional string execution_id = 11;
  string trace_id = 12;                 // 分布式追踪标识（TraceContext 由统一仓库冻结后扩展）
  bytes payload = 13;                   // 不透明业务 payload（wire 契约；端口层经 VehicleMessage.payload 传递）
}
