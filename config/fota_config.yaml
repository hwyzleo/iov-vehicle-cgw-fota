# CGW-FOTA Configuration

# 统一日志配置（CGW-FOTA-DSN-CR-003 / CGW-FW-SPEC设计 §4）
common:
  log:
    schema_version: 1
    level: INFO
    strict: false
    async:
      enabled: true
      queue_size: 4096
      flush_interval_ms: 1000
    console:
      enabled: true
    file:
      enabled: false
      root: /var/log/cgw
      max_file_size_mb: 20
      max_files: 5
      total_budget_mb: 100
    redact:
      identifiers: mask
      payload_max_bytes: 256
    format: standard

fota:
  # 日志服务级覆盖（CGW-FOTA-DSN-CR-003）
  log:
    level: INFO
    modules:
      orchestrator: INFO
      snapshot_assembler: INFO
      diag_client: INFO
      inventory_reporter: INFO
  
  # Snapshot configuration
  snapshot:
    max_ecu_count: 100
    snapshot_seq_initial: 1
    throttle_interval_ms: 5000
    dedup_window_size: 100
  
  # SOME/IP service configuration
  someip:
    # CGW-DIAG service (CGW-DIAG-DSN-CR-007: Service ID: 0x1110, Instance ID: 0x0001, Transport: TCP, Port: 51110)
    diag_service:
      service_id: 0x1110  # CGW-DIAG-DSN-CR-007: updated from 0x7725
      instance_id: 0x0001
      ip_address: "127.0.0.1"
      port: 51110  # CGW-DIAG-DSN-CR-007: updated from 30501
    
    # TBOX service (CGW-FOTA-DSN-CR-002 updated)
    # Service ID: 0x6101, Instance ID: 0x0001, Transport: TCP, Port: 56101
    tbox_service:
      service_id: 0x6101  # CGW-FOTA-DSN-CR-002: updated from 0x0002
      instance_id: 0x0001
      ip_address: "127.0.0.1"
      port: 56101  # CGW-FOTA-DSN-CR-002: updated from 30502
    
    # FOTA Provider service (CGW-FOTA-DSN-CR-002)
    # Service ID: 0x1120, Instance ID: 0x0001, Transport: TCP, Port: 51120
    fota_provider:
      service_id: 0x1120
      instance_id: 0x0001
      ip_address: "0.0.0.0"
      port: 51120
  
  # Reporting configuration
  reporting:
    initial_report_delay_ms: 1000
    max_retry_count: 3
    retry_interval_ms: 1000
  
  # Logging (legacy fields, superseded by common.log.* / fota.log.* above)
  logging:
    level: "INFO"
    file: "/var/log/cgw_fota.log"
