# =============================================================================
# config/schema/fota.schema.yaml - CGW-FOTA 配置 Schema (CGW-FOTA-DSN-CR-004)
# =============================================================================
# 版本化、可执行 schema，供 CGW-BUILD 在发布期对最终 /etc/cgw/conf.d/fota.yaml
# 执行校验。运行时校验由 cgw-framework-config 六阶段解析 + FotaConfig::from() 的
# 类型/范围/跨字段检查完成（fail-closed）。common.* 由公共 schema 单独验证，本
# schema 不复制其字段定义。
#
# 约束要点：
#   - 唯一顶层 fota，拒绝未知顶层键；common 由公共 schema 单独验证。
#   - inventory / diag / tbox 使用 additionalProperties: false。
#   - log 由 cgw-framework-log schema 片段约束（受控引用，不在此复制字段定义）。
#   - 约束布尔、整数、范围与必填字段，并为所有默认值提供验证用示例。
#   - 声明 schema 版本，供 BUILD 在 manifest 中记录 schema 路径、来源 revision 与摘要。
#   - 不接受 VIN、device_sn、token、密钥、证书私钥或其他设备实例秘密字段。
# =============================================================================
schema_version: 1
schema_name: cgw-fota.fota
description: >
  CGW-FOTA fota.* 配置契约。Service/Instance/Method ID、传输协议与端口不进入本
  文件，继续以整车 SOME/IP Service Registry 为唯一 SSOT。

# 顶层仅允许 fota；common 由公共 schema 单独验证，不得在此复制顶层 common:。
type: object
additionalProperties: false
required: [fota]
properties:
  fota:
    type: object
    additionalProperties: false
    required: [inventory, diag]
    properties:
      inventory:
        type: object
        additionalProperties: false
        required:
          - change_detection_enabled
          - min_report_interval_ms
          - max_pending_requests
          - dedupe_max_entries
          - dedupe_ttl_ms
        properties:
          change_detection_enabled:
            type: boolean
            default: true
          min_report_interval_ms:
            type: integer
            minimum: 0
            default: 300000
            description: 自动上报节流最小间隔（毫秒），非负。
          max_pending_requests:
            type: integer
            minimum: 1
            maximum: 1024
            default: 32
            description: 等待队列上限；同一时刻仍最多运行一轮采集。
          dedupe_max_entries:
            type: integer
            minimum: 1
            maximum: 1024
            default: 100
            description: 去重窗口条目上限 (CGW-FOTA-DSN-CR-005)。
          dedupe_ttl_ms:
            type: integer
            minimum: 0
            default: 3600000
            description: 去重窗口保留期（毫秒），0 表示无 TTL。
      diag:
        type: object
        additionalProperties: false
        required:
          - collect_timeout_ms
          - retry_max_attempts
          - retry_backoff_ms
        properties:
          collect_timeout_ms:
            type: integer
            minimum: 1
            default: 30000
          retry_max_attempts:
            type: integer
            minimum: 0
            maximum: 10
            default: 2
          retry_backoff_ms:
            type: integer
            minimum: 0
            default: 1000
      someip:
        # CGW-FOTA-DSN-CR-007/010/011 SOME/IP 框架接入（契约 B 有界传输与 Registry 寻址）
        type: object
        additionalProperties: false
        properties:
          transport:
            # 契约 B SOME/IP 通用传输有界配置 (CGW-FOTA-DSN-CR-010/011)
            type: object
            additionalProperties: false
            properties:
              exchange_timeout_ms:
                type: integer
                minimum: 1
                default: 10000
                description: 单次 exchange/publish 本地超时上限（毫秒）。
              max_envelope_bytes:
                type: integer
                minimum: 64
                default: 262144
                description: 序列化 Envelope 大小上限（字节）。
              max_payload_bytes:
                type: integer
                minimum: 1
                default: 262144
                description: payload bytes 上限（字节）。
              max_in_flight:
                type: integer
                minimum: 1
                maximum: 1024
                default: 64
                description: 有界 in-flight correlation 表容量。
              downlink_queue_capacity:
                type: integer
                minimum: 1
                maximum: 1048576
                default: 256
                description: 下行有界队列容量。
              downlink_workers:
                type: integer
                minimum: 1
                maximum: 64
                default: 1
                description: 下行独立 executor 线程数。
              in_flight_ttl_ms:
                type: integer
                minimum: 1
                default: 30000
                description: correlation 条目清理 TTL（毫秒）。
              availability_wait_ms:
                type: integer
                minimum: 1
                default: 5000
                description: start() 有界等待 TBOX 服务可用时间（毫秒）。
          generic_transport:
            # TBOX 通用消息服务寻址（Registry/IDL/运行配置；CR-010/011 fail-closed）
            # Service/Instance 0x6101/0x0001/TCP 56101 已分配；此处仅承载 Registry
            # 分配的 generic Method/Event/Eventgroup ID。全 0 = 未分配（契约 B blocked）。
            type: object
            additionalProperties: false
            properties:
              method_id:
                type: integer
                minimum: 0
                maximum: 32767
                default: 0
                description: Registry 分配的 generic exchange/publish Method（1..0x7FFF）。
              event_id:
                type: integer
                minimum: 0
                maximum: 65534
                default: 0
                description: Registry 分配的 generic 下行 Event（>= 0x8000）。
              eventgroup_id:
                type: integer
                minimum: 0
                maximum: 65534
                default: 0
                description: Registry 分配的 Eventgroup（1..0xFFFE）。
              interface_major:
                type: integer
                minimum: 1
                maximum: 255
                default: 1
                description: TBOX-SOMEIP 接口 major 版本（过渡 SSOT = 1）。
      log:
        # 服务级日志覆盖；字段由 cgw-framework-log schema 片段约束，本 schema 不复制。
        type: object
        additionalProperties: true
      cloud:
        # CGW-FOTA-DSN-CR-009 车云 FOTA 编排配置（CR-011 由 ota 收敛）
        type: object
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            default: true
          protocol_version:
            type: string
            default: fota-v1
          task_check_interval_ms:
            type: integer
            minimum: 1
            default: 60000
          reconcile_on_start:
            type: boolean
            default: true
          event_outbox_max:
            type: integer
            minimum: 1
            maximum: 1048576
            default: 4096
          event_batch_max:
            type: integer
            minimum: 1
            maximum: 65535
            default: 64
          control_ack_timeout_ms:
            type: integer
            minimum: 1
            default: 5000
          cloud_call_timeout_ms:
            type: integer
            minimum: 1
            default: 10000
      mock:
        # CGW-FOTA-DSN-CR-009 测试桩配置（NON_PRODUCTION）
        type: object
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            default: false
            description: 量产必须 false；CGW-FOTA 运行时在非测试构建拒绝 true。
          scenario_path:
            type: string
            default: ""
          virtual_clock:
            type: boolean
            default: false

# -----------------------------------------------------------------------------
# 秘密扫描策略：以下字段名在最终发布文件中出现即 fail-closed（CGW-BUILD 执行）。
# -----------------------------------------------------------------------------
forbidden_keys:
  - vin
  - device_sn
  - token
  - secret
  - password
  - passwd
  - api_key
  - private_key
  - cert_private_key

# -----------------------------------------------------------------------------
# 验证用示例（同时是缺省模板的默认值来源）
# -----------------------------------------------------------------------------
examples:
  - fota:
      inventory:
        change_detection_enabled: true
        min_report_interval_ms: 300000
        max_pending_requests: 32
        dedupe_max_entries: 100
        dedupe_ttl_ms: 3600000
      diag:
        collect_timeout_ms: 30000
        retry_max_attempts: 2
        retry_backoff_ms: 1000
      someip:
        transport:
          exchange_timeout_ms: 10000
          max_envelope_bytes: 262144
          max_payload_bytes: 262144
          max_in_flight: 64
          downlink_queue_capacity: 256
          downlink_workers: 1
          in_flight_ttl_ms: 30000
          availability_wait_ms: 5000
        generic_transport:
          method_id: 0
          event_id: 0
          eventgroup_id: 0
          interface_major: 1
      cloud:
        enabled: true
        protocol_version: fota-v1
        task_check_interval_ms: 60000
        reconcile_on_start: true
        event_outbox_max: 4096
        event_batch_max: 64
        control_ack_timeout_ms: 5000
        cloud_call_timeout_ms: 10000
      mock:
        enabled: false
        scenario_path: ""
        virtual_clock: false
      log: {}
